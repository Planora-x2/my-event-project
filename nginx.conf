# ============================================================
#  Nginx configuration for my-event-project
#  Place this file at: /etc/nginx/sites-available/myapp
#  Then enable it:
#    sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ─── Upstream servers (Gunicorn + Daphne) ───────────────────
upstream django_http {
    server 127.0.0.1:8000;   # Gunicorn handles all HTTP/REST API
}

upstream django_ws {
    server 127.0.0.1:8001;   # Daphne handles WebSocket connections
}

# ─── HTTP server block ───────────────────────────────────────
server {
    listen 80;
    server_name YOUR_EC2_PUBLIC_IP;  # ec2_setup.sh auto-replaces this

    # Max upload size (for media file uploads)
    client_max_body_size 20M;

    # ── Angular SPA (frontend) ──────────────────────────────
    # Serve the built Angular app from the dist folder
    root /home/ubuntu/my-event-project/frontend/dist/frontend/browser;
    index index.html;

    location / {
        # SPA fallback: any unknown route goes to index.html (Angular Router handles it)
        try_files $uri $uri/ /index.html;
    }

    # ── Django REST API ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://django_http;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Django Admin ─────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django_http;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSockets (Daphne / Django Channels) ───────────────
    location /ws/ {
        proxy_pass          http://django_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_read_timeout  86400s;   # Keep WS connections alive (24h)
        proxy_send_timeout  86400s;
    }

    # ── Django collected static files ───────────────────────
    # Run `python manage.py collectstatic` to generate this folder
    location /static/ {
        alias /home/ubuntu/my-event-project/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files (user uploads) ───────────────────────────
    location /media/ {
        alias /home/ubuntu/my-event-project/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
