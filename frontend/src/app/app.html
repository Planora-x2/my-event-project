<!-- Global Flower Effect -->
<div class="flower-container">
  <div class="flower" *ngFor="let flower of flowers"
       [style.left.%]="flower.left"
       [style.animation-duration.s]="flower.duration"
       [style.animation-delay.s]="flower.delay"
       [style.font-size.rem]="flower.size">
       {{ flower.type }}
  </div>
</div>

<app-navbar></app-navbar>
<main class="container" style="padding: 2rem 1rem; max-width: 1280px; margin: 0 auto; margin-top: 72px;">
  <router-outlet></router-outlet>
</main>

<!-- Global Chatbot -->
<app-chatbot></app-chatbot>
