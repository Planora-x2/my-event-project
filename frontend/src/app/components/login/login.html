<div class="auth-layout" data-aos="fade-up" data-aos-duration="1000">
  <div class="auth-bg" style="background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80');"></div>
  <!-- Left: Form Side -->
  <div class="auth-form-side">
    <div class="auth-brand" data-aos="fade-down" data-aos-delay="200">
      <!-- <a routerLink="/" class="brand-logo">💍 <span class="text-gradient">Eternally Yours</span></a> -->
    </div>
    <div class="auth-form-container glass" data-aos="fade-up" data-aos-delay="300">
      <div class="auth-welcome">
        <div class="welcome-ornament">✦ ✦ ✦</div>
        <h1>Welcome Back</h1>
        <p class="text-muted">Sign in to manage your beautiful celebrations</p>
      </div>
      
      <form class="auth-form" (ngSubmit)="onSubmit()" id="login-form" data-aos="fade-up" data-aos-delay="400">
        <div class="form-group">
          <label class="input-label" for="login-username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              class="input-field input-with-icon" 
              placeholder="Enter your username" 
              name="username" 
              [(ngModel)]="username" 
              required
              id="login-username">
          </div>
        </div>
        
        <div class="form-group">
          <label class="input-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              class="input-field input-with-icon" 
              placeholder="Enter your password" 
              name="password" 
              [(ngModel)]="password" 
              required
              id="login-password">
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 auth-submit-btn" id="login-submit-btn">
          Sign In to Your Account
        </button>
        
        <div class="divider"><span>or continue with</span></div>
        
        <div class="social-signin">
          <asl-google-signin-btn type="standard" size="large" width="300"></asl-google-signin-btn>
        </div>
        
        <p class="auth-switch">
          New here? 
          <a routerLink="/register" class="text-gradient auth-switch-link" id="login-to-register">Begin Your Journey →</a>
        </p>
      </form>
    </div>
  </div>
  
  <!-- Right: Image Side -->
  <div class="auth-image-side" data-aos="fade-left" data-aos-duration="1200">
    <div class="auth-bg" [ngStyle]="{'background-image': 'url(' + currentBgImage + ')'}"></div>
    <div class="auth-image-overlay">
      <div class="auth-quote glass-gold" data-aos="fade-up" data-aos-delay="600">
        <div class="quote-flowers">🌸 🌷 🌸</div>
        <blockquote>"The best platform for discovering and booking the most extraordinary wedding celebrations."</blockquote>
        <cite>— Eternally Yours Community</cite>
        <div class="quote-stars">★★★★★</div>
      </div>
    </div>
  </div>
</div>
