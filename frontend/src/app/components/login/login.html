<div class="auth-split-layout animate-fade-in">
  <div class="auth-form-section">
    <div class="auth-form-container">
      <h2 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main);">Welcome Back</h2>
      <p class="text-muted" style="margin-bottom: 2.5rem; font-size: 1.1rem;">Log in to manage your events and bookings</p>
      
      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="input-label">Username</label>
          <input type="text" class="input-field" placeholder="Enter username" name="username" [(ngModel)]="username" required>
        </div>
        
        <div class="form-group">
          <label class="input-label">Password</label>
          <input type="password" class="input-field" placeholder="Enter password" name="password" [(ngModel)]="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100" style="padding: 1rem; font-size: 1.05rem; margin-top: 1rem;">Log In</button>
        
        <div class="divider">
          <span>OR CONTINUE WITH</span>
        </div>
        
        <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
          <asl-google-signin-btn type="standard" size="large" width="300"></asl-google-signin-btn>
        </div>
        
        <p class="text-center mt-4" style="color: var(--text-muted); font-weight: 500;">
          Don't have an account? <a routerLink="/register" class="text-gradient" style="font-weight: 700;">Sign up</a>
        </p>
      </form>
    </div>
  </div>
  
  <div class="auth-image-section">
    <div class="auth-dynamic-bg" [ngStyle]="{'background-image': 'url(' + currentBgImage + ')'}"></div>
    <div class="auth-image-overlay">
      <div class="auth-quote glass">
        <h3 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">"The best platform for discovering and managing events seamlessly."</h3>
        <p style="color: var(--text-muted); font-weight: 500;">— EventHub Community</p>
      </div>
    </div>
  </div>
</div>
