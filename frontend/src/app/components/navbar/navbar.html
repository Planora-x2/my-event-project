<nav class="navbar glass">
  <div class="nav-container">
    <a routerLink="/" class="logo text-gradient">EventHub</a>
    <div class="nav-links" *ngIf="currentUser$ | async as user; else loggedOut">
      <a routerLink="/" class="nav-link">Events</a>
      <a *ngIf="user.role === 'CLIENT' || user.role === 'ADMIN'" routerLink="/client-dashboard" class="nav-link">Client Portal</a>
      <a *ngIf="user.role === 'ADMIN'" routerLink="/admin-dashboard" class="nav-link">Admin Portal</a>
      
      <div class="user-profile">
        <label for="profile-upload" class="profile-pic-container">
          <img *ngIf="user.profile_picture; else defaultPic" [src]="getProfilePicUrl(user.profile_picture)" alt="Profile" class="profile-pic">
          <ng-template #defaultPic>
            <div class="profile-pic default-pic">{{ user.username.charAt(0).toUpperCase() }}</div>
          </ng-template>
        </label>
        <input type="file" id="profile-upload" (change)="onFileSelected($event)" accept="image/*" style="display: none;">
        
        <span class="nav-link">Signed in as <strong>{{ user.username }}</strong></span>
        <button (click)="logout()" class="btn btn-secondary btn-sm">Logout</button>
      </div>
    </div>
    
    <ng-template #loggedOut>
      <div class="nav-links">
        <a routerLink="/" class="nav-link">Events</a>
        <div class="auth-buttons">
          <button routerLink="/login" class="btn btn-secondary">Login</button>
          <button routerLink="/register" class="btn btn-primary">Sign Up</button>
        </div>
      </div>
    </ng-template>
  </div>
</nav>
