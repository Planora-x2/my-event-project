<div class="auth-layout animate-fade-in">
  <div class="auth-bg" style="background-image: url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1920&q=80');"></div>
  <!-- Left: Image Side -->
  <div class="auth-image-side">
    <div class="auth-bg" [ngStyle]="{'background-image': 'url(' + currentBgImage + ')'}"></div>
    <div class="auth-image-overlay">
      <div class="auth-quote glass-gold">
        <div class="quote-flowers">🌸 🌷 🌸</div>
        <blockquote>"Join thousands of couples and wedding planners creating unforgettable memories."</blockquote>
        <cite>— Eternally Yours Community</cite>
        <div class="quote-stars">★★★★★</div>
      </div>
    </div>
  </div>

  <!-- Right: Form Side -->
  <div class="auth-form-side" data-aos="fade-up">
    <div class="auth-brand">
      <a routerLink="/" class="brand-logo">💍 <span class="text-gradient">Eternally Yours</span></a>
    </div>
    <div class="auth-form-container glass">
      <div class="auth-welcome">
        <div class="welcome-ornament">✦ ✦ ✦</div>
        <h1>Begin Your Journey</h1>
        <p class="text-muted">Create an account to plan and attend beautiful weddings</p>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()" id="register-form">
        <div class="form-group">
          <label class="input-label" for="reg-username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              class="input-field input-with-icon" 
              placeholder="Choose a username" 
              name="username" 
              [(ngModel)]="username" 
              required
              id="reg-username">
          </div>
        </div>

        <div class="form-group">
          <label class="input-label" for="reg-email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input 
              type="email" 
              class="input-field input-with-icon" 
              placeholder="Your email address" 
              name="email" 
              [(ngModel)]="email" 
              required
              id="reg-email">
          </div>
        </div>
        
        <div class="form-group">
          <label class="input-label" for="reg-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              class="input-field input-with-icon" 
              placeholder="Create a secure password" 
              name="password" 
              [(ngModel)]="password" 
              required
              id="reg-password">
          </div>
        </div>

        <div class="form-group">
          <label class="input-label" for="reg-role">I want to...</label>
          <select class="input-field" name="role" [(ngModel)]="role" id="reg-role">
            <option value="USER">💌 Attend & Book Weddings</option>
            <option value="CLIENT">🎩 Organize Wedding Events</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 auth-submit-btn" id="register-submit-btn">
          Create My Account
        </button>
        
        <div class="divider"><span>or continue with</span></div>
        
        <div class="social-signin">
          <asl-google-signin-btn type="standard" size="large" width="300"></asl-google-signin-btn>
        </div>
        
        <p class="auth-switch">
          Already have an account? 
          <a routerLink="/login" class="text-gradient auth-switch-link" id="register-to-login">Sign In →</a>
        </p>
      </form>
    </div>
  </div>
</div>
